<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iteris Code — вчимося кодити разом</title>
<meta name="description" content="Безкоштовні уроки з Python, Go, Java, TypeScript, JavaScript, C++, HTML, CSS, SQL та Pascal українською.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📓%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="Iteris Code — вчимося кодити разом">
<meta property="og:description" content="Безкоштовні уроки з Python, Go, Java, TypeScript, JavaScript, C++, HTML, CSS, SQL та Pascal українською.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2F5BEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBFCFF; --panel:#FFFFFF; --ink:#14213D; --muted:#56637F;
  --grid:#E3EAF7; --line:#C8D3EA; --pen:#2F5BEA; --pen-ink:#FFFFFF;
  --hl:#FFE45C; --hl-ink:#14213D; --margin:#E5484D; --ok:#1E8E4E;
  --display:"Unbounded","Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cell:28px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1526; --panel:#171F36; --ink:#EAEFFC; --muted:#9CA9C9;
    --grid:#182240; --line:#2B3963; --pen:#86A2FF; --pen-ink:#0F1526; --ok:#4CC988;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1526; --panel:#171F36; --ink:#EAEFFC; --muted:#9CA9C9;
  --grid:#182240; --line:#2B3963; --pen:#86A2FF; --pen-ink:#0F1526; --ok:#4CC988;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
body{
  margin:0;min-height:100%;font-family:var(--body);font-size:1.0625rem;line-height:1.6;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:3px;border-radius:4px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.05rem}
.brand svg{flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:.95rem}
nav.main a:hover{background:var(--grid)}
nav.main a[aria-current="page"]{background:var(--hl);color:var(--hl-ink)}
.theme{border:2px solid var(--ink);background:var(--panel);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
@media (max-width:820px){
  .top .wrap{flex-wrap:wrap;padding-block:8px;gap:8px 12px}
  nav.main{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  nav.main a{white-space:nowrap}
  .theme{margin-left:auto}
}

/* generic */
main{display:block;padding-block:48px 72px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:10px;border:2px solid var(--ink);font-weight:700;text-decoration:none;background:var(--panel);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--pen);color:var(--pen-ink)}
.btn.small{padding:8px 14px;font-size:.92rem;box-shadow:2px 2px 0 var(--ink)}
.crumbs{font-size:.95rem;color:var(--muted);margin-bottom:20px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.badge{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:#fff;flex:none;border:2px solid var(--ink)}
.badge.sm{width:40px;height:40px;border-radius:10px;font-size:.8rem}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:8px 24px}
.hero h1{font-size:clamp(2.2rem,5.4vw,4.2rem);font-weight:800;line-height:1.05}
.hero p.lead{font-size:1.25rem;max-width:34ch;margin:22px 0 30px;color:var(--muted)}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:36px}}

/* sheet widget */
.sheet{background:var(--panel);border:2px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.tabs{display:flex;border-bottom:2px solid var(--ink);background:var(--grid)}
.tabs button{flex:1;padding:12px 8px;border:0;background:transparent;font-weight:700;border-right:2px solid var(--ink)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel)}
.pane{padding:20px;min-height:270px}
.pane[hidden]{display:none}
.pane .hint{margin:0 0 14px;color:var(--muted);font-size:.95rem}
table.grid{border-collapse:collapse;width:100%;font-size:.98rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:0;text-align:left}
table.grid th{background:var(--grid);font-weight:600;padding:6px 10px;color:var(--muted);font-size:.85rem}
table.grid td{padding:7px 10px}
table.grid td input{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:0}
table.grid td input:focus{outline:2px solid var(--pen);outline-offset:2px}
table.grid td.sel{outline:3px solid var(--pen);outline-offset:-2px;background:var(--hl);color:var(--hl-ink);font-weight:700}
.fx{font-family:var(--code);font-size:.85rem;margin-top:12px;color:var(--muted)}
pre.code{margin:0 0 14px;padding:14px 16px;background:#0B1020;color:#EAEFFC;border:1px solid var(--line);border-radius:10px;font-family:var(--code);font-size:.92rem;line-height:1.55;overflow-x:auto}
.field{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.field input[type=text]{flex:1;min-width:140px;padding:9px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font:inherit;color:inherit}
.out{padding:12px 14px;border:2px dashed var(--line);border-radius:10px;font-family:var(--code);min-height:48px;overflow-wrap:anywhere}
.out.render{font-family:var(--body)}
.out.render h1{font-family:var(--display);font-size:1.4rem}

/* directions (home) */
.section-title{font-size:clamp(1.5rem,3vw,2.1rem);margin:72px 0 8px}
.section-sub{color:var(--muted);margin:0 0 24px;max-width:56ch}
.ruled{background:var(--panel);border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.dir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px 40px;padding:28px 28px 28px 56px;border-bottom:2px solid var(--ink);position:relative}
.dir:last-child{border-bottom:0}
.dir::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.dir h3{font-size:1.5rem;margin-bottom:8px}
.dir h3 a{text-decoration:none}
.dir h3 a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.dir p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:12px;align-content:center}
.chip{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border:2px solid var(--ink);border-radius:12px;text-decoration:none;background:var(--paper);flex:1 1 200px}
.chip:hover{background:var(--hl);color:var(--hl-ink)}
.chip b{display:block;line-height:1.2}
.chip small{color:var(--muted);font-size:.85rem}
.chip:hover small{color:var(--hl-ink)}
.chip.soon{border-style:dashed;opacity:.75;pointer-events:none}
@media (max-width:760px){.dir{grid-template-columns:1fr;padding:22px 20px 22px 44px}.dir::before{left:24px}}

/* continue + stats */
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:24px}
@media (max-width:820px){.duo{grid-template-columns:1fr}}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:24px}
.card h3{font-size:1.15rem;margin-bottom:10px}
.card p{margin:0 0 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;text-align:left}
.stats div{padding-right:8px}
.stats strong{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.stats span{color:var(--muted);font-size:.95rem}
.stats-note{font-size:.9rem;margin:16px 0 0}

/* course page */
.course-head{display:grid;grid-template-columns:auto 1fr;gap:20px 24px;align-items:center;margin-bottom:28px}
.course-head h1{font-size:clamp(2rem,4.5vw,3rem)}
.course-head p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.meter{display:flex;align-items:center;gap:14px;margin:0 0 28px;flex-wrap:wrap}
.bar{flex:1 1 220px;height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.lessons{list-style:none;margin:0;padding:0;background:var(--panel);border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.lessons li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.lessons li:last-child{border-bottom:0}
.lessons li:hover{background:var(--grid)}
.lessons .n{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted)}
.lessons a.t{text-decoration:none;font-weight:600}
.lessons a.t:hover{text-decoration:underline;text-underline-offset:4px}
.lessons li.done .t{color:var(--muted)}
.lessons li.done .n{color:var(--ok)}
.row-actions{display:flex;gap:8px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);text-decoration:none;font-size:.85rem;font-weight:600}
.icon-btn:hover{background:var(--hl);color:var(--hl-ink)}
.icon-btn[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ink)}
@media (max-width:640px){
  .lessons li{grid-template-columns:36px minmax(0,1fr);}
  .lessons .row-actions{grid-column:2}
  .course-head{grid-template-columns:1fr}
}

.lessons li.chap{display:block;background:var(--grid);font-family:var(--display);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 18px}
.lessons li.chap:hover{background:var(--grid)}
.side li.sch{font-family:var(--display);font-size:.72rem;color:var(--muted);text-transform:uppercase;margin:12px 8px 4px}
/* lesson page */
.lesson-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.lesson-layout{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:14px;max-height:calc(100vh - 110px);overflow:auto}
.side h4{margin:0 0 8px;font-family:var(--display);font-size:.95rem}
.side ol{list-style:none;margin:0;padding:0}
.side a{display:flex;gap:10px;padding:7px 8px;border-radius:8px;text-decoration:none;font-size:.93rem;line-height:1.35}
.side a:hover{background:var(--grid)}
.side a[aria-current="page"]{background:var(--hl);color:var(--hl-ink);font-weight:700}
.side a span{color:var(--muted);min-width:1.6em;font-weight:600}
.side a[aria-current="page"] span{color:var(--hl-ink)}
@media (max-width:900px){.side{position:static;max-height:none}}
article.lesson{background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:clamp(20px,4vw,44px)}
article.lesson h1{font-size:clamp(1.6rem,3.4vw,2.4rem);margin:8px 0 20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.95rem}
.tag{padding:3px 10px;border-radius:99px;border:2px solid var(--ink);font-weight:700;font-size:.85rem;color:#fff}
.lesson-actions{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 28px}
.mock{border:2px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--muted);margin-bottom:28px}
.prose{max-width:68ch}
.prose h2{font-size:1.3rem;margin:32px 0 12px}
.prose p{margin:0 0 14px}
.callout{border-left:6px solid var(--pen);background:var(--grid);padding:14px 18px;border-radius:0 10px 10px 0;margin:20px 0}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tasks li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.tasks input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:40px;flex-wrap:wrap}

/* empty state */
.empty{text-align:left;max-width:60ch}
.empty h1{font-size:clamp(2rem,4.5vw,3rem);margin-bottom:16px}
.empty p{color:var(--muted);margin:0 0 24px}

footer{border-top:2px solid var(--ink);background:var(--panel);padding:36px 0 44px}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
footer h4{margin:0 0 10px;font-family:var(--display);font-size:.95rem}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
footer a{text-decoration:none;color:var(--muted)}
footer a:hover{color:var(--ink);text-decoration:underline}
footer p{margin:10px 0 0;color:var(--muted);max-width:32ch}
@media (max-width:760px){footer .wrap{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@keyframes blink{50%{outline-color:transparent}}
td.sel{animation:blink 1.4s steps(1) 3}


/* екран уроку з редактором */
.ws{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:24px;align-items:start}
.ws-left{max-height:calc(100vh - 150px);overflow:auto;padding-right:8px}
.ws-right{position:sticky;top:90px;display:grid;gap:10px}
.ws-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ws-tab{font-family:var(--mono,monospace);font-weight:700;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--grid)}
.ws-spacer{flex:1}
.ws-editor{height:min(420px,50vh);border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper)}
.ws-plain{width:100%;height:100%;box-sizing:border-box;border:0;padding:12px;resize:none;font:14px/1.5 var(--mono,monospace);background:#0B1020;color:#EAEFFC;tab-size:2}
.ws-term{margin:0;min-height:120px;max-height:260px;overflow:auto;padding:12px 14px;border-radius:10px;background:#0B1020;color:#EAEFFC;font:13px/1.55 var(--mono,monospace);white-space:pre-wrap}
.t-ok{color:#5BD68A}.t-fail{color:#FF8A80}.t-dim{color:#9AA6C5}
.task-brief{margin-top:28px;padding-top:8px;border-top:2px dashed var(--line)}
.paywall{padding:14px 16px;border:2px solid var(--ink);border-radius:10px;background:linear-gradient(135deg,rgba(47,91,234,.14),rgba(123,97,255,.14))}
.paywall p{margin:6px 0 10px}
.ws-win{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;border:2px solid #1E8E4E;background:rgba(30,142,78,.14);animation:ws-pop .45s cubic-bezier(.2,1.4,.4,1)}
.ws-win-icon{font-size:2rem}
@keyframes ws-pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ws-win{animation:none}}
@media (max-width:900px){.ws{grid-template-columns:1fr}.ws-left{max-height:none;overflow:visible;padding:0}.ws-right{position:static}}
/* особистий кабінет */
.acct{display:flex;align-items:center;gap:10px;flex:none}
.acct-user{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;max-width:180px}
.acct-user span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{display:inline-block;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);object-fit:cover;background:var(--grid);flex:none}
.avatar.big{width:72px;height:72px}
@media (max-width:640px){.acct-user span:last-child{display:none}}
.dash{display:grid;gap:24px}
.dash h3{margin:0 0 12px;font-size:1.05rem}
.dash-head{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.dash-head h1{font-size:clamp(1.4rem,3.4vw,2.1rem);margin:0}
.dash-head p{margin:4px 0 0;color:var(--muted)}
.dash-head .grow{flex:1 1 240px}
.plan-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plan{display:inline-block;padding:4px 12px;border-radius:99px;border:2px solid var(--ink);font-weight:800;font-size:.8rem}
.plan.free{background:var(--grid)}
.plan.pro{background:linear-gradient(135deg,#2F5BEA,#7B61FF);color:#fff;border-color:transparent}
.dash-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.dash-muted{color:var(--muted)}
.dash-focus{font-weight:700;margin:6px 0 14px}
.dash-guest{max-width:560px;display:grid;gap:14px}
.dash-guest h1{font-size:clamp(1.5rem,3.5vw,2.2rem);margin:0}
.streak{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.streak span:first-child{font-size:2rem}
.streak b{font-family:var(--display);font-size:2.6rem;line-height:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.stats3 strong{display:block;font-family:var(--display);font-size:1.8rem}
.stats3 span{color:var(--muted);font-size:.85rem}
.skills{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.skill h3{display:flex;justify-content:space-between;gap:10px}
.skill .bar{flex:none;height:12px;margin-bottom:12px}
.skill ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92rem}
.skill li{display:flex;justify-content:space-between;gap:8px}
.skill li a{font-weight:600;text-decoration:none}
.locked{color:var(--muted);font-size:.82rem;margin:12px 0 0}
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.heat i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--grid);border:1px solid var(--line)}
.heat .l1,.legend .l1{background:#B9D7C4}.heat .l2,.legend .l2{background:#7FC49A}
.heat .l3,.legend .l3{background:#3FA96B}.heat .l4,.legend .l4{background:#1E8E4E}
.legend{display:flex;align-items:center;gap:4px;margin:10px 0 0;font-size:.82rem}
.legend i{margin:0 1px}
.subs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.subs li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.s-ok{color:var(--ok);font-weight:700}.s-fail{color:var(--margin);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:50;max-width:90vw;font-weight:600}
</style>
</head>
<body>
<header class="top">
