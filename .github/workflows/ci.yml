# Перевірки на кожен pull request і пуш у main та staging: збірка, типи фронтенду, тести. Налаштування захисту гілки main: Documentation/security.md
name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.json
      - run: npm test
